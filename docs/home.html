<script>
  const kids = [
    {emoji:'🐣', name:'小满', meta:'二年级上 · 已练习 24 天', done:18, total:30},
    {emoji:'🐰', name:'果果', meta:'三年级下 · 已练习 41 天', done:30, total:30}
  ];
  let kidIndex = 0;
  let listOpen = false;

  function renderKid(){
    const k = kids[kidIndex];
    document.getElementById('kidAvatar').textContent = k.emoji;
    document.getElementById('kidName').textContent = k.name;
    document.getElementById('kidMeta').textContent = k.meta;
    document.getElementById('doneCount').textContent = k.done;
    document.getElementById('todayBar').style.width = Math.round(k.done / k.total * 100) + '%';
    const badge = document.getElementById('todayBadge');
    badge.textContent = k.done >= k.total ? '已完成' : (k.done > 0 ? '进行中' : '未开始');
  }

  function switchKid(){
    listOpen = !listOpen;
    document.getElementById('kidList').classList.toggle('hidden', !listOpen);
    document.getElementById('kidList').classList.toggle('flex', listOpen);
  }

  function pickKid(i, e){
    e.stopPropagation();
    kidIndex = i;
    renderKid();
    document.querySelectorAll('.kid-opt').forEach(function(el, idx){
      el.classList.toggle('bg-[#FFF7EF]', idx === i);
      el.classList.toggle('border-[#E9824C]', idx === i);
      el.classList.toggle('bg-[#F8F8F6]', idx !== i);
      el.classList.toggle('border-[#EAE3DA]', idx !== i);
    });
  }
  renderKid();
</script>
