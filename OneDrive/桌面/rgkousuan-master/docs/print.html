<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>口算天天练 · 打印题纸</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#F3EADF;color:#4B3B32;}
  .scroll-hide{scrollbar-width:none;}
  .scroll-hide::-webkit-scrollbar{display:none;}
  .card{background:#fff;border-radius:22px;border:1px solid #F6EADC;box-shadow:0 6px 18px rgba(139,112,86,.06);}
  .a4{width:100%;aspect-ratio:1 / 1.414;background:#fff;box-shadow:0 8px 24px rgba(120,95,70,.14);}
  .qt{font-size:var(--qs,13px);line-height:1.9;}
  .seg.on{background:#E9824C;color:#fff;}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#FBF6EE] flex flex-col overflow-hidden relative shadow-2xl">
<header class="shrink-0 bg-white px-5 pt-4 pb-3 border-b border-[#F4E8DA]">
<div class="flex items-center justify-between">
<a class="w-9 h-9 rounded-full bg-[#FBF6EE] flex items-center justify-center text-[#8B7565]" href="home.html">
<iconify-icon icon="ph:caret-left-bold"></iconify-icon>
</a>
<h1 class="text-[16px] font-extrabold">打印题纸</h1>
<button class="w-9 h-9 rounded-full bg-[#FBF6EE] flex items-center justify-center text-[#8B7565]" onclick="showToast('已复制题纸链接到剪贴板')">
<iconify-icon icon="ph:share-network-bold"></iconify-icon>
</button>
</div>
<div class="mt-3 grid grid-cols-2 gap-1 bg-[#FBF3E9] p-1 rounded-2xl">
<button class="seg on h-8 rounded-xl text-[12px] font-semibold text-[#A99079] transition" id="btnQ" onclick="switchView('q')">题目页</button>
<button class="seg h-8 rounded-xl text-[12px] font-semibold text-[#A99079] transition" id="btnA" onclick="switchView('a')">答案页</button>
</div>
</header>
<main class="flex-1 min-h-0 overflow-y-auto overflow-x-hidden scroll-hide px-5 pt-3 pb-28">
<!-- 设置条 -->
<div class="flex items-center gap-2 mb-3">
<span class="chip bg-[#FFF2E6] text-[#C97B49]">A4 · 纵向</span>
<span class="chip bg-white border border-[#F0E3D5] text-[#8B7565]" id="paperMeta">30 题 · 单面</span>
<span class="chip bg-white border border-[#F0E3D5] text-[#8B7565]">含姓名栏</span>
<button class="ml-auto text-[11px] text-[#C97B49] flex items-center gap-0.5" onclick="adjustSize()">
<iconify-icon icon="ph:text-aa"></iconify-icon>字号
      </button>
</div>
<!-- A4 预览 -->
<div class="a4 rounded-sm px-4 py-4 flex flex-col overflow-hidden">
<div class="flex items-start justify-between border-b border-dashed border-[#E6D8C8] pb-2">
<div>
<p class="text-[12px] font-extrabold tracking-wide">口算练习 · 二年级上</p>
<p class="text-[7px] text-[#A99079] mt-0.5">表内乘法 · 100 以内加减 · 限时 8 分钟</p>
</div>
<div class="text-right">
<p class="text-[7px] text-[#8B7565]">姓名：__________</p>
<p class="text-[7px] text-[#8B7565] mt-1">日期：____ 月 ____ 日   得分：____</p>
</div>
</div>
<div class="text-[7px] text-[#B6A190] mt-1.5" id="paperTitle">共 30 题　每题 3 分　请直接写出得数</div>
<div class="mt-1 flex-1 qt text-[#3A2C24]" id="paperBody" style="--qs:12px"></div>
<div class="border-t border-dashed border-[#E6D8C8] pt-1.5 flex items-center justify-between text-[6.5px] text-[#B6A190]">
<span>口算天天练 · 家长陪伴版</span>
<span>第 1 页 / 共 <span id="pageCount">2</span> 页</span>
</div>
</div>
<!-- 打印选项 -->
<section class="card p-4 mt-3">
<h2 class="text-[13px] font-bold mb-3 flex items-center gap-1.5">
<iconify-icon class="text-[#E9824C]" icon="ph:sliders-horizontal-bold"></iconify-icon>打印选项
      </h2>
<div class="grid grid-cols-2 gap-2">
<button class="opt-btn rounded-xl border border-[#E9824C] bg-[#FFF7EF] py-2.5 text-[11px] font-semibold text-[#C97B49]" onclick="pickOpt(this,'题量')">30 题 / 页</button>
<button class="opt-btn rounded-xl border border-[#F0E3D5] bg-white py-2.5 text-[11px] text-[#8B7565]" onclick="pickOpt(this,'题量')">60 题 / 两页</button>
<button class="opt-btn rounded-xl border border-[#F0E3D5] bg-white py-2.5 text-[11px] text-[#8B7565]" onclick="pickOpt(this,'格式')">带竖式空格</button>
<button class="opt-btn rounded-xl border border-[#F0E3D5] bg-white py-2.5 text-[11px] text-[#8B7565]" onclick="pickOpt(this,'格式')">紧凑两列</button>
</div>
<label class="mt-3 flex items-center justify-between">
<span class="text-[12px] text-[#8B7565]">答案页单独打印</span>
<span class="w-11 h-6 rounded-full bg-[#E9824C] relative transition cursor-pointer" data-on="1" id="ansPageSwitch" onclick="toggleAns(this)">
<span class="absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-white shadow transition"></span>
</span>
</label>
<label class="mt-2.5 flex items-center justify-between">
<span class="text-[12px] text-[#8B7565]">页脚显示网址二维码</span>
<span class="w-11 h-6 rounded-full bg-[#E9824C] relative transition cursor-pointer" data-on="1" onclick="toggleAns(this)">
<span class="absolute top-0.5 right-0.5 w-5 h-5 rounded-full bg-white shadow transition"></span>
</span>
</label>
</section>
<p class="text-center text-[10px] text-[#B6A190] mt-3 leading-relaxed">纸张建议 A4 80g，缩放比例 100%<br/>打印前请在浏览器中关闭页眉页脚</p>
</main>
<!-- 底部 -->
<div class="shrink-0 px-5 pt-2.5 pb-4 bg-gradient-to-t from-[#FBF6EE] via-[#FBF6EE] to-[#FBF6EE]/60">
<div class="flex gap-2.5">
<button class="w-12 h-12 rounded-2xl bg-white border border-[#EBCBAF] flex items-center justify-center text-[#C97B49]" onclick="showToast('已保存到相册（模拟）')">
<iconify-icon class="text-lg" icon="ph:image-square-bold"></iconify-icon>
</button>
<button class="flex-1 h-12 rounded-2xl bg-[#E9824C] text-white text-[14px] font-bold flex items-center justify-center gap-1.5 shadow-md shadow-[#E9824C]/25 active:scale-[.98] transition" onclick="savePdf()">
<iconify-icon class="text-lg" icon="ph:file-pdf-bold"></iconify-icon> 保存 PDF
      </button>
<a class="w-12 h-12 rounded-2xl bg-white border border-[#EBCBAF] flex items-center justify-center text-[#C97B49]" href="setup.html">
<iconify-icon class="text-lg" icon="ph:arrows-clockwise-bold"></iconify-icon>
</a>
</div>
</div>
<div class="hidden absolute left-1/2 -translate-x-1/2 bottom-20 z-30 bg-[#4B3B32]/90 text-white text-[11px] px-4 py-2 rounded-full whitespace-nowrap" id="toast"></div>
</div>
<script>
  const qs = [];
  for (let i = 0; i < 30; i++) {
    const a = 2 + (i * 3) % 8;
    const b = 3 + (i * 5) % 7;
    if (i % 4 === 0) {
      qs.push({t: a + ' × ' + b, a: a * b});
    } else if (i % 4 === 1) {
      const x = 30 + (i * 7) % 60, y = 10 + (i * 3) % 25;
      qs.push({t: x + ' − ' + y, a: x - y});
    } else if (i % 4 === 2) {
      const x = 20 + (i * 5) % 50, y = 5 + (i * 2) % 30;
      qs.push({t: x + ' + ' + y, a: x + y});
    } else {
      qs.push({t: a + ' × ' + b + ' + ' + (a + 2), a: a * b + a + 2});
    }
  }

  let view = 'q';
  let size = 12;
  let answerOn = true;

  function renderPaper(){
    const body = document.getElementById('paperBody');
    document.getElementById('paperTitle').textContent = view === 'q'
      ? '共 30 题　每题 3 分　请直接写出得数'
      : '参考答案　（家长核对用）';
    body.style.setProperty('--qs', size + 'px');
    if (view === 'q') {
      body.innerHTML = '<div class="grid grid-cols-3 gap-x-1.5 gap-y-0.5">' +
        qs.map(function(q, i){
          return '<div class="flex items-start gap-0.5 whitespace-nowrap">' +
            '<span class="text-[#B6A190] text-[0.85em] w-[1.4em] shrink-0 text-right">' + (i + 1) + '.</span>' +
            '<span>' + q.t + ' = <span class="text-[#D8C9B8]">____</span></span>' +
          '</div>';
        }).join('') +
        '</div>';
    } else {
      body.innerHTML = '<div class="grid grid-cols-3 gap-x-1.5 gap-y-0.5">' +
        qs.map(function(q, i){
          return '<div class="flex items-start gap-0.5 whitespace-nowrap">' +
            '<span class="text-[#B6A190] text-[0.85em] w-[1.4em] shrink-0 text-right">' + (i + 1) + '.</span>' +
            '<span>' + q.t + ' = <span class="font-bold text-[#E9824C]">' + q.a + '</span></span>' +
          '</div>';
        }).join('') +
        '</div>';
    }
  }

  function switchView(v){
    view = v;
    document.getElementById('btnQ').classList.toggle('on', v === 'q');
    document.getElementById('btnA').classList.toggle('on', v === 'a');
    renderPaper();
  }

  function adjustSize(){
    size = size >= 14 ? 10 : size + 2;
    document.getElementById('paperMeta').textContent = size === 10 ? '30 题 · 宽松版' : (size === 12 ? '30 题 · 单面' : '30 题 · 紧凑版');
    renderPaper();
  }

  function pickOpt(btn, group){
    const parent = btn.parentElement;
    parent.querySelectorAll('.opt-btn').forEach(function(el){
      el.classList.remove('border-[#E9824C]', 'bg-[#FFF7EF]', 'text-[#C97B49]', 'font-semibold');
      el.classList.add('border-[#F0E3D5]', 'bg-white', 'text-[#8B7565]');
    });
    btn.classList.remove('border-[#F0E3D5]', 'bg-white', 'text-[#8B7565]');
    btn.classList.add('border-[#E9824C]', 'bg-[#FFF7EF]', 'text-[#C97B49]', 'font-semibold');
    if (group === '题量') {
      document.getElementById('pageCount').textContent = btn.textContent.indexOf('60') > -1 ? '4' : '2';
    }
  }

  function toggleAns(el){
    const on = el.dataset.on === '1';
    el.dataset.on = on ? '0' : '1';
    el.classList.toggle('bg-[#E9824C]', !on);
    el.classList.toggle('bg-[#E3D6C8]', on);
    el.firstElementChild.classList.toggle('right-0.5', !on);
    el.firstElementChild.classList.toggle('left-0.5', on);
  }

  function savePdf(){
    showToast('正在生成 PDF …');
    setTimeout(function(){
      document.getElementById('toast').textContent = 'PDF 已保存到「文件 › 下载」';
    }, 1200);
  }

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(t._timer);
    t._timer = setTimeout(function(){ t.classList.add('hidden'); }, 2200);
  }

  renderPaper();
</script>
</body>
</html>
