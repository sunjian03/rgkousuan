<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>口算天天练 · 答题中</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://code.iconify.design/iconify-icon/2.3.0/iconify-icon.min.js"></script>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#F3EADF;color:#4B3B32;}
  .scroll-hide{scrollbar-width:none;}
  .scroll-hide::-webkit-scrollbar{display:none;}
  .key{transition:transform .08s ease, background .15s ease;}
  .key:active{transform:scale(.95);background:#FBE7D6;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}
  .pop{animation:pop .45s ease-out both;}
  @keyframes floatUp{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}
  .float-up{animation:floatUp 1s ease-out forwards;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
  .shake{animation:shake .3s ease-in-out;}
</style>
</head>
<body class="w-full h-full m-0 overflow-hidden flex items-center justify-center">
<div class="w-full h-full max-w-[393px] max-h-[852px] bg-[#FDF8F1] flex flex-col overflow-hidden relative shadow-2xl">
<!-- 顶部 -->
<header class="shrink-0 px-5 pt-4">
<div class="flex items-center justify-between">
<a class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center text-[#B6A190]" href="home.html">
<iconify-icon icon="ph:x-bold"></iconify-icon>
</a>
<div class="flex items-center gap-3">
<div class="flex items-center gap-1 bg-white rounded-full px-3 py-1.5 shadow-sm">
<iconify-icon class="text-[#E9824C] text-sm" icon="ph:timer-duotone"></iconify-icon>
<span class="text-[13px] font-bold tabular-nums" id="timer">01:24</span>
</div>
<div class="flex items-center gap-1 bg-white rounded-full px-3 py-1.5 shadow-sm">
<iconify-icon class="text-[#F0B44E] text-sm" icon="ph:star-fill"></iconify-icon>
<span class="text-[13px] font-bold" id="starCount">4</span>
</div>
</div>
</div>
<!-- 进度 -->
<div class="mt-4 flex items-center gap-3">
<div class="flex-1 h-3 rounded-full bg-[#F2E7DA] overflow-hidden">
<div class="h-full rounded-full bg-gradient-to-r from-[#F8C89F] to-[#EC9257] transition-all duration-300" id="bar" style="width:13%"></div>
</div>
<span class="text-[12px] font-bold text-[#8B7565] shrink-0">第 <span class="text-[#E9824C]" id="idx">5</span>/30 题</span>
</div>
</header>
<!-- 题目区 -->
<main class="flex-1 min-h-0 flex flex-col items-center justify-center px-5 relative">
<p class="text-[12px] text-[#B6A190] mb-3 flex items-center gap-1">
<iconify-icon icon="ph:lightbulb-filament"></iconify-icon> 表内乘法 · 标准模式
    </p>
<div class="w-full bg-white rounded-[28px] border border-[#F5E8D8] shadow-[0_10px_30px_rgba(180,140,100,.10)] px-4 py-7 text-center relative" id="card">
<div class="absolute -top-3 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full bg-[#FDF0E2] text-[10px] text-[#C58E5E] font-semibold">想一想，再按数字</div>
<div class="mt-2 flex items-center justify-center gap-2 flex-wrap">
<span class="text-[52px] font-extrabold tracking-tight leading-none">7</span>
<span class="text-[42px] font-bold text-[#E9824C] leading-none">×</span>
<span class="text-[52px] font-extrabold tracking-tight leading-none">8</span>
<span class="text-[42px] font-bold text-[#8B7565] leading-none mx-1">=</span>
<span class="min-w-[86px] h-[74px] px-2 rounded-2xl bg-[#FBF3E9] border-2 border-dashed border-[#EBCBAF] flex items-center justify-center text-[52px] font-extrabold text-[#E9824C] leading-none" id="answerBox">?</span>
</div>
<p class="mt-5 text-[12px] text-[#B6A190]" id="tipText">答案填在方框里，按 ✔ 确认</p>
</div>
<!-- 反馈层 -->
<div class="hidden absolute inset-0 flex items-center justify-center pointer-events-none z-20" id="feedback">
<div class="bg-[#FFF7EC] border-2 border-[#F7D9BB] rounded-[28px] px-7 py-5 text-center shadow-xl">
<p class="text-[42px] leading-none" id="fbEmoji">⭐</p>
<p class="text-[18px] font-extrabold text-[#D1793F] mt-2" id="fbText">太棒啦！</p>
</div>
</div>
</main>
<!-- 数字键盘 -->
<section class="shrink-0 px-5 pb-4 pt-1">
<div class="grid grid-cols-3 gap-2.5">
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('1')">1</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('2')">2</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('3')">3</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('4')">4</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('5')">5</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('6')">6</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('7')">7</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('8')">8</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('9')">9</button>
<button class="key h-[54px] rounded-2xl bg-[#FBF1E6] border border-[#F2E0CC] text-[#C58E5E] flex items-center justify-center shadow-sm" onclick="backspace()">
<iconify-icon class="text-2xl" icon="ph:backspace-fill"></iconify-icon>
</button>
<button class="key h-[54px] rounded-2xl bg-white border border-[#F2E5D6] text-[24px] font-bold shadow-sm" onclick="press('0')">0</button>
<button class="key h-[54px] rounded-2xl bg-[#7BAE8B] text-white flex items-center justify-center shadow-md shadow-[#7BAE8B]/30" onclick="submitAnswer()">
<iconify-icon class="text-2xl" icon="ph:check-bold"></iconify-icon>
</button>
</div>
<div class="mt-3 flex items-center justify-center gap-4 text-[11px] text-[#B6A190]">
<span class="flex items-center gap-1"><iconify-icon icon="ph:speaker-high-fill"></iconify-icon> 读题</span>
<span class="w-px h-3 bg-[#E4D6C7]"></span>
<button class="flex items-center gap-1" onclick="showHint()">需要一点提示？</button>
</div>
</section>
</div>
<script>
  const questions = [];
  for (let i = 0; i < 30; i++) {
    const a = 3 + (i * 3) % 7;
    const b = 4 + (i * 5) % 6;
    if (i % 3 === 2) {
      questions.push({ text: a + ' × ' + b + ' + ' + (a + 1), answer: String(a * b + a + 1) });
    } else {
      questions.push({ text: a + ' × ' + b, answer: String(a * b) });
    }
  }

  let current = 4;
  let input = '';
  let stars = 4;
  let seconds = 84;
  let locked = false;

  function renderQuestion(){
    const q = questions[current];
    const parts = q.text.split(' ');
    document.getElementById('card').querySelector('.flex.items-center.justify-center.gap-2').innerHTML =
      parts.map(function(p, i){
        if (i === parts.length - 1) {
          return '<span class="text-[52px] font-extrabold tracking-tight leading-none">' + p + '</span>';
        }
        const isOp = (p === '+' || p === '×' || p === '-' || p === '÷');
        return '<span class="' + (isOp ? 'text-[42px] font-bold text-[#E9824C]' : 'text-[52px] font-extrabold tracking-tight') + ' leading-none">' + p + '</span>';
      }).join('') +
      '<span class="text-[42px] font-bold text-[#8B7565] leading-none mx-1">=</span>' +
      '<span id="answerBox" class="min-w-[86px] h-[74px] px-2 rounded-2xl bg-[#FBF3E9] border-2 border-dashed border-[#EBCBAF] flex items-center justify-center text-[52px] font-extrabold text-[#E9824C] leading-none">?</span>';
    input = '';
    document.getElementById('answerBox').textContent = '?';
    document.getElementById('idx').textContent = current + 1;
    const total = 30;
    const pct = Math.round(current / total * 100);
    document.getElementById('bar').style.width = pct + '%';
    document.getElementById('tipText').textContent = '答案填在方框里，按 ✔ 确认';
  }

  function press(n){
    if (locked) return;
    if (input.length >= 3) return;
    input += n;
    document.getElementById('answerBox').textContent = input;
  }

  function backspace(){
    if (locked) return;
    input = input.slice(0, -1);
    document.getElementById('answerBox').textContent = input || '?';
  }

  function showHint(){
    const q = questions[current];
    document.getElementById('tipText').textContent = '小提示：先把 ' + q.text.split(' ')[0] + ' 和 ' + q.text.split(' ')[2] + ' 算出来，再算后面的。';
  }

  function submitAnswer(){
    if (locked || !input) return;
    locked = true;
    const q = questions[current];
    const correct = input === q.answer;
    const fb = document.getElementById('feedback');
    fb.classList.remove('hidden');
    if (correct) {
      stars += 1;
      document.getElementById('starCount').textContent = stars;
      document.getElementById('fbEmoji').textContent = '⭐';
      document.getElementById('fbText').textContent = '太棒啦！答对咯';
      document.getElementById('answerBox').classList.add('border-[#7BAE8B]', 'bg-[#F2F8F2]');
      document.getElementById('answerBox').classList.add('pop');
    } else {
      document.getElementById('fbEmoji').textContent = '🌱';
      document.getElementById('fbText').textContent = '差一点点，答案是 ' + q.answer;
      document.getElementById('card').classList.add('shake');
      document.getElementById('answerBox').textContent = q.answer;
      document.getElementById('answerBox').classList.add('border-[#EBA58E]', 'bg-[#FDF1EC]');
    }
    setTimeout(function(){
      fb.classList.add('hidden');
      document.getElementById('card').classList.remove('shake');
      const next = current + 1;
      if (next >= questions.length) {
        window.location.href = 'result.html';
        return;
      }
      current = next;
      locked = false;
      renderQuestion();
    }, correct ? 900 : 1500);
  }

  setInterval(function(){
    seconds += 1;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById('timer').textContent = m + ':' + s;
  }, 1000);

  renderQuestion();
</script>
</body>
</html>
